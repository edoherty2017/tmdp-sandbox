[project]
name = "tmdp-sandbox"
version = "0.1.0"
description = "T-MDP sandbox for catastrophic action prevention experiments"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.9.0",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
